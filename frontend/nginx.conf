server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sonda de saude do proprio Nginx (liveness/readiness e HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A API do servico principal e alcancada pelo mesmo nome DNS no Docker Compose e no Kubernetes.
    location /api/ {
        proxy_pass http://gestarafeto-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Ativos com hash no nome podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rotas do React Router caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
