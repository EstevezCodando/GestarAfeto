services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestarafeto}
      POSTGRES_USER: ${POSTGRES_USER:-gestarafeto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestarafeto}
    ports:
      - "5432:5432"
    volumes:
      - gestarafeto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestarafeto} -d ${POSTGRES_DB:-gestarafeto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banco exclusivo do microsservico de alertas (padrao database-per-service).
  # Fica em um container e volume proprios: nenhum dos dois servicos consegue ler
  # as tabelas do outro, o que forca a integracao a acontecer pela API REST.
  postgres-alertas:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_ALERTAS_DB:-gestarafeto_alertas}
      POSTGRES_USER: ${POSTGRES_ALERTAS_USER:-gestarafeto}
      POSTGRES_PASSWORD: ${POSTGRES_ALERTAS_PASSWORD:-gestarafeto}
    ports:
      - "5433:5432"
    volumes:
      - gestarafeto_alertas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ALERTAS_USER:-gestarafeto} -d ${POSTGRES_ALERTAS_DB:-gestarafeto_alertas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker de mensagens do TP4. A imagem "-management" traz o painel web em :15672,
  # usado na demonstracao para ver exchange, filas, bindings e as mensagens passando.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gestarafeto}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gestarafeto}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - gestarafeto_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Aplicacao (profile "app"): `docker compose --profile app up -d --build`.
  # Sem o profile, o compose sobe so a infraestrutura, como no fluxo de desenvolvimento.
  # ---------------------------------------------------------------------------
  gestarafeto-app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: gestarafeto/app:${GESTARAFETO_VERSION:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GESTARAFETO_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestarafeto}
      GESTARAFETO_DB_USER: ${POSTGRES_USER:-gestarafeto}
      GESTARAFETO_DB_PASSWORD: ${POSTGRES_PASSWORD:-gestarafeto}
      GESTARAFETO_ALERTAS_URL: http://gestarafeto-alertas:8081
      GESTARAFETO_RABBIT_HOST: rabbitmq
      GESTARAFETO_RABBIT_USER: ${RABBITMQ_USER:-gestarafeto}
      GESTARAFETO_RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-gestarafeto}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-true}
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
      GESTARAFETO_AMBIENTE: compose
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gestarafeto-alertas:
    profiles: ["app"]
    build:
      context: ./alertas-service
      dockerfile: Dockerfile
    image: gestarafeto/alertas:${GESTARAFETO_VERSION:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GESTARAFETO_ALERTAS_DB_URL: jdbc:postgresql://postgres-alertas:5432/${POSTGRES_ALERTAS_DB:-gestarafeto_alertas}
      GESTARAFETO_ALERTAS_DB_USER: ${POSTGRES_ALERTAS_USER:-gestarafeto}
      GESTARAFETO_ALERTAS_DB_PASSWORD: ${POSTGRES_ALERTAS_PASSWORD:-gestarafeto}
      GESTARAFETO_RABBIT_HOST: rabbitmq
      GESTARAFETO_RABBIT_USER: ${RABBITMQ_USER:-gestarafeto}
      GESTARAFETO_RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-gestarafeto}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-true}
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
      GESTARAFETO_AMBIENTE: compose
    ports:
      - "8081:8081"
    depends_on:
      postgres-alertas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gestarafeto/frontend:${GESTARAFETO_VERSION:-dev}
    ports:
      - "${GESTARAFETO_FRONTEND_PORT:-3080}:8080"
    depends_on:
      - gestarafeto-app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observabilidade (R3). Fazem parte do profile "app" e podem subir sozinhos
  # com `docker compose --profile obs up -d`.
  #   Jaeger  http://localhost:16686  traces
  #   Grafana http://localhost:3001   logs (Loki) + traces (Jaeger), login admin/admin
  # ---------------------------------------------------------------------------
  jaeger:
    profiles: ["app", "obs"]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP (usado pelos servicos)
    restart: unless-stopped

  loki:
    profiles: ["app", "obs"]
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - gestarafeto_loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    profiles: ["app", "obs"]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - loki
      - jaeger
    restart: unless-stopped

volumes:
  gestarafeto_loki_data:
  gestarafeto_postgres_data:
  gestarafeto_alertas_postgres_data:
  gestarafeto_rabbitmq_data:
