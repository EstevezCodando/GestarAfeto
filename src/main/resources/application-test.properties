spring.datasource.url=jdbc:h2:mem:gestarafeto-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Testes nao dependem do microsservico de alertas: o gatilho automatico fica desligado
# e cada teste de integracao habilita o que precisa explicitamente.
gestarafeto.alertas.integracao-automatica=false
