spring.application.name=GestarAfeto
server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Integracao com o microsservico de alertas -------------------------------
gestarafeto.alertas.url=${GESTARAFETO_ALERTAS_URL:http://localhost:8081}
# Reavaliacao automatica de alertas apos mudancas no checklist.
gestarafeto.alertas.integracao-automatica=true

# Feign + Spring Cloud CircuitBreaker (Resilience4j).
spring.cloud.openfeign.circuitbreaker.enabled=true
# Apache HttpClient 5 no lugar do HttpURLConnection padrao, que nao suporta PATCH.
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Abre o circuito apos 50% de falhas na janela e espera 10s antes de testar de novo,
# para nao repetir chamadas a um microsservico que ja se mostrou indisponivel.
resilience4j.circuitbreaker.instances.gestarafeto-alertas.sliding-window-size=10
resilience4j.circuitbreaker.instances.gestarafeto-alertas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gestarafeto-alertas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.gestarafeto-alertas.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.instances.gestarafeto-alertas.timeout-duration=6s

# --- RabbitMQ: publicacao de eventos (TP4) -----------------------------------
spring.rabbitmq.host=${GESTARAFETO_RABBIT_HOST:localhost}
spring.rabbitmq.port=${GESTARAFETO_RABBIT_PORT:5672}
spring.rabbitmq.username=${GESTARAFETO_RABBIT_USER:gestarafeto}
spring.rabbitmq.password=${GESTARAFETO_RABBIT_PASSWORD:gestarafeto}

# Confirmacoes do broker: sem isso, uma falha de publicacao passaria despercebida.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Se o broker estiver fora do ar, desistir rapido. A publicacao acontece depois do commit
# da operacao do usuario e nao pode segurar a resposta da requisicao.
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=500ms
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-interval=2s
spring.rabbitmq.connection-timeout=3s
