# Configuracao NAO sensivel. Senhas ficam no Secret "gestarafeto-secrets",
# criado por scripts/k8s-up.sh e nunca versionado.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gestarafeto-config
  labels:
    app.kubernetes.io/part-of: gestarafeto
data:
  SPRING_PROFILES_ACTIVE: prod
  GESTARAFETO_AMBIENTE: kubernetes
  # Servico principal
  GESTARAFETO_DB_URL: jdbc:postgresql://postgres-core:5432/gestarafeto
  GESTARAFETO_DB_USER: gestarafeto
  GESTARAFETO_ALERTAS_URL: http://gestarafeto-alertas:8081
  # Microsservico de alertas
  GESTARAFETO_ALERTAS_DB_URL: jdbc:postgresql://postgres-alertas:5432/gestarafeto_alertas
  GESTARAFETO_ALERTAS_DB_USER: gestarafeto
  # Mensageria
  GESTARAFETO_RABBIT_HOST: rabbitmq
  GESTARAFETO_RABBIT_PORT: "5672"
  GESTARAFETO_RABBIT_USER: gestarafeto
  # Observabilidade (namespace gestarafeto-obs)
  OTEL_EXPORT_ENABLED: "true"
  OTEL_TRACES_ENDPOINT: http://jaeger.gestarafeto-obs.svc.cluster.local:4318/v1/traces
  OTEL_LOGS_ENDPOINT: http://loki.gestarafeto-obs.svc.cluster.local:3100/otlp/v1/logs
  GESTARAFETO_TRACING_SAMPLING: "1.0"
