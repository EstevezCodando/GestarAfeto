            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: gestarafeto-secrets, key: alertas-db-password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: dados, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
