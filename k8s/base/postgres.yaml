# Dois bancos independentes (database-per-service). Cada um e um StatefulSet com PVC proprio:
# os dados sobrevivem a reinicio e a recriacao do pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres-core
  labels: {app.kubernetes.io/name: postgres-core, app.kubernetes.io/part-of: gestarafeto}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres-core}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-core
  labels: {app.kubernetes.io/name: postgres-core, app.kubernetes.io/part-of: gestarafeto}
spec:
  serviceName: postgres-core
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres-core}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres-core, app.kubernetes.io/part-of: gestarafeto, app.kubernetes.io/component: database}
    spec:
      enableServiceLinks: false
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: gestarafeto}
            - {name: POSTGRES_USER, valueFrom: {configMapKeyRef: {name: gestarafeto-config, key: GESTARAFETO_DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: gestarafeto-secrets, key: core-db-password}}}
            # Subdiretorio: evita o "lost+found" da raiz do volume, que faz o initdb abortar.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: dados, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: dados}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-alertas
  labels: {app.kubernetes.io/name: postgres-alertas, app.kubernetes.io/part-of: gestarafeto}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres-alertas}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-alertas
  labels: {app.kubernetes.io/name: postgres-alertas, app.kubernetes.io/part-of: gestarafeto}
spec:
