# Servico principal: Deployment + Service + HPA + PodDisruptionBudget.
apiVersion: v1
kind: Service
metadata:
  name: gestarafeto-app
  labels: {app.kubernetes.io/name: gestarafeto-app, app.kubernetes.io/part-of: gestarafeto}
spec:
  selector: {app.kubernetes.io/name: gestarafeto-app}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestarafeto-app
  labels: {app.kubernetes.io/name: gestarafeto-app, app.kubernetes.io/part-of: gestarafeto, app.kubernetes.io/component: backend}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: gestarafeto-app}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gestarafeto-app, app.kubernetes.io/part-of: gestarafeto, app.kubernetes.io/component: backend}
    spec:
      # Sem isso o Kubernetes injeta variaveis como GESTARAFETO_ALERTAS_PORT=tcp://10.x.x.x:8081
      # (uma por Service), que colidem com propriedades do Spring e impedem a aplicacao de subir.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: gestarafeto/app:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: gestarafeto-config}
          env:
            - {name: GESTARAFETO_DB_PASSWORD, valueFrom: {secretKeyRef: {name: gestarafeto-secrets, key: core-db-password}}}
            - {name: GESTARAFETO_RABBIT_PASSWORD, valueFrom: {secretKeyRef: {name: gestarafeto-secrets, key: rabbitmq-password}}}
          # Startup protege a subida lenta da JVM (migracoes Flyway) sem afrouxar a liveness.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gestarafeto-app
  labels: {app.kubernetes.io/name: gestarafeto-app, app.kubernetes.io/part-of: gestarafeto}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gestarafeto-app}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Pods, value: 2, periodSeconds: 30}
    scaleDown:
      # Espera 1 minuto de calmaria antes de reduzir, para nao oscilar.
      stabilizationWindowSeconds: 60
      policies:
        - {type: Pods, value: 1, periodSeconds: 30}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gestarafeto-app
  labels: {app.kubernetes.io/name: gestarafeto-app, app.kubernetes.io/part-of: gestarafeto}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gestarafeto-app}
