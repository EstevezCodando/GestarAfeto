# Rede em modelo "nega tudo, libera o necessario" para o trafego de ENTRADA no namespace.
# Obs.: o Kubernetes so aplica NetworkPolicy se o CNI do cluster implementar; o resultado da
# verificacao neste ambiente esta documentado em docs/KUBERNETES.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gestarafeto-frontend}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gestarafeto-app}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gestarafeto-frontend}
        # Gerador de carga usado na demonstracao de escalabilidade.
        - podSelector:
            matchLabels: {app.kubernetes.io/component: load-test}
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertas-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gestarafeto-alertas}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gestarafeto-app}
        - podSelector:
            matchLabels: {app.kubernetes.io/component: load-test}
      ports:
        - {port: 8081, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-core-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres-core}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gestarafeto-app}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-alertas-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres-alertas}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gestarafeto-alertas}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gestarafeto-app}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gestarafeto-alertas}
      ports:
        - {port: 5672, protocol: TCP}
