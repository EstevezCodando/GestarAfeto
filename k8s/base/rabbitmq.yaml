apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: gestarafeto}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    # Painel de administracao: existe so dentro do cluster. O acesso e por
    # port-forward (ver README), nunca exposto publicamente.
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: gestarafeto}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: gestarafeto, app.kubernetes.io/component: broker}
    spec:
      enableServiceLinks: false
      securityContext: {runAsUser: 100, runAsGroup: 101, fsGroup: 101, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - {name: RABBITMQ_DEFAULT_USER, valueFrom: {configMapKeyRef: {name: gestarafeto-config, key: GESTARAFETO_RABBIT_USER}}}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: gestarafeto-secrets, key: rabbitmq-password}}}
          volumeMounts:
            - {name: dados, mountPath: /var/lib/rabbitmq}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
  volumeClaimTemplates:
    - metadata: {name: dados}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
