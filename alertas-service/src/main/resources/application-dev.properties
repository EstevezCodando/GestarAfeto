spring.datasource.url=${GESTARAFETO_ALERTAS_DB_URL:jdbc:postgresql://localhost:5433/gestarafeto_alertas}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${GESTARAFETO_ALERTAS_DB_USER:gestarafeto}
spring.datasource.password=${GESTARAFETO_ALERTAS_DB_PASSWORD:gestarafeto}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
