spring.datasource.url=jdbc:h2:mem:gestarafeto-alertas-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.cloud.config.enabled=false

# RabbitMQ desligado nos testes: sem RabbitAdmin e sem iniciar os listeners.
# O teste com Testcontainers religa o auto-startup explicitamente.
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
