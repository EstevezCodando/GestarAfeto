spring.application.name=gestarafeto-alertas
server.port=${GESTARAFETO_ALERTAS_PORT:8081}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Cloud Config: desligado por padrao para que o servico suba sozinho.
# Com um Config Server no ar, basta GESTARAFETO_CONFIG_ENABLED=true.
# O prefixo "optional:" garante que a ausencia do servidor nunca impeca a inicializacao.
spring.cloud.config.enabled=${GESTARAFETO_CONFIG_ENABLED:false}
spring.cloud.config.uri=${GESTARAFETO_CONFIG_URI:http://localhost:8888}
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:${GESTARAFETO_CONFIG_URI:http://localhost:8888}

# Parametros do motor de regras. Recarregaveis em runtime via POST /actuator/refresh
# quando servidos por um Config Server (bean anotado com @RefreshScope).
gestarafeto.alertas.regras.antecedencia-semanas=2
gestarafeto.alertas.regras.semanas-gestacao-total=40
gestarafeto.alertas.regras.alertar-nao-obrigatorios=true

management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.show-details=always

# --- RabbitMQ: consumo de eventos (TP4) --------------------------------------
spring.rabbitmq.host=${GESTARAFETO_RABBIT_HOST:localhost}
spring.rabbitmq.port=${GESTARAFETO_RABBIT_PORT:5672}
spring.rabbitmq.username=${GESTARAFETO_RABBIT_USER:gestarafeto}
spring.rabbitmq.password=${GESTARAFETO_RABBIT_PASSWORD:gestarafeto}

# O container confirma a mensagem so depois que o metodo do listener retorna sem
# excecao. Se o servico cair no meio do processamento, a mensagem volta para a fila
# em vez de se perder.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=10

# Repeticao com espera crescente para falhas transitorias (banco indisponivel, por exemplo).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
# Esgotadas as tentativas, nao reenfileira: o broker manda para a DLQ configurada na fila.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
