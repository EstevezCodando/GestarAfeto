# Pilha de observabilidade no Kubernetes (namespace proprio, separado da aplicacao).
# Os arquivos de configuracao sao os MESMOS usados pelo Docker Compose: uma unica fonte.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gestarafeto-obs
resources:
  - namespace.yaml
  - jaeger.yaml
  - loki.yaml
  - grafana.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: loki-config
    files:
      - loki-config.yaml
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana/provisioning/datasources/datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yaml=grafana/provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards
    files:
      - gestarafeto-logs.json=grafana/dashboards/gestarafeto-logs.json
