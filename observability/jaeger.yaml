# Jaeger v2 com armazenamento em memoria: adequado para o ambiente simulado.
# Os traces se perdem se o pod reiniciar; em producao real usar Elasticsearch/OpenSearch.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: {app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: gestarafeto}
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: ui, port: 16686, targetPort: ui}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: {app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: gestarafeto}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: gestarafeto, app.kubernetes.io/component: tracing}
    spec:
      # Sem isso o Kubernetes injeta variaveis como GESTARAFETO_ALERTAS_PORT=tcp://10.x.x.x:8081
      # (uma por Service), que colidem com propriedades do Spring e impedem a aplicacao de subir.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.11.0
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: ui, containerPort: 16686}
          readinessProbe:
            httpGet: {path: /, port: ui}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: ui}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
