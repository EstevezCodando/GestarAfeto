# Jaeger (OTLP) e Loki (OTLP) aceitam trafego apenas dos servicos da aplicacao
# (namespace gestarafeto-prod) e do Grafana. A UI do Grafana/Jaeger e acessada por port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gestarafeto-prod}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 4318, protocol: TCP}
        - {port: 16686, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-entrada
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loki}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gestarafeto-prod}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 3100, protocol: TCP}
