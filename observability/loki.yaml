apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: gestarafeto}
spec:
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: gestarafeto}
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: gestarafeto, app.kubernetes.io/component: logs}
    spec:
      # Sem isso o Kubernetes injeta variaveis como GESTARAFETO_ALERTAS_PORT=tcp://10.x.x.x:8081
      # (uma por Service), que colidem com propriedades do Spring e impedem a aplicacao de subir.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: grafana/loki:3.5.5
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: dados, mountPath: /loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: dados}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
