# Loki em modo monolitico, armazenamento em disco. Suficiente para o ambiente simulado;
# em producao real o armazenamento de objetos (S3/GCS) substitui o filesystem.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Necessario para o endpoint OTLP: trace_id, span_id e severidade chegam como
  # metadado estruturado, consultavel sem virar rotulo de alta cardinalidade.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h        # 7 dias

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
